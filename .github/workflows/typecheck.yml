name: TypeScript validation
on:
  push:
    branches:
      - main
      - feat/operava-commercial-maya-billing
      - feat/prepaid-user-access-admin
  pull_request:
    branches: [main]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run types
      - run: npm run typecheck
