name = "ai-api-store-hub"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database – replace database_id after running: wrangler d1 create ai-api-hub
[[d1_databases]]
binding = "DB"
database_name = "ai-api-hub"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# AI binding (Workers AI + AI Gateway)
[ai]
binding = "AI"

# Workers for Platforms – create the namespace in dashboard or via API first
# [[dispatch_namespaces]]
# binding = "DISPATCHER"
# namespace = "tenants"
# remote = true

[vars]
ENVIRONMENT = "development"
# Default AI Gateway name (create one in Cloudflare dashboard → AI → AI Gateway)
AI_GATEWAY_ID = "default"

# Secrets (set via `wrangler secret put ...`)
# SESSION_SECRET
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
