name = "ai-api-store-hub"
main = "src/index.ts"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]

# D1: bind a dedicated database after Cloudflare account quota is increased.
# Do not point this Worker at another production application's database.
[[d1_databases]]
binding = "DB"
database_name = "ai-api-store-hub"
database_id = "REQUIRES_DEDICATED_D1_DATABASE"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "staging"
AI_GATEWAY_ID = "operava-api-store-hub"
PAYMONGO_MODE = "test"

# Configure as Worker secrets (never commit values):
# SESSION_SECRET
# PAYMONGO_SECRET_KEY
# PAYMONGO_WEBHOOK_SECRET
# USD_PHP_RATE
